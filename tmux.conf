###############
#   general   #
###############

# prefix C-t
set-option -g prefix C-t

# macOS: run zsh directly. reattach-to-user-namespace isn't needed on
# modern tmux (3.2+) + modern macOS; clipboard goes through set-clipboard
# below instead.
set -g default-command "/bin/zsh"

# true color support (needed for onedark/vim, and the Catppuccin statusline)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# let tmux forward copies to the terminal's clipboard (OSC 52 — iTerm2 supports it)
set -s set-clipboard on

# screen saver — lock-after-time is in seconds
set -g lock-after-time 1500
set -g lock-command "curl -sS wttr.in/Tokyo | head -27"

# Keep current directory in new pane/window
bind c new-window -c "#{pane_current_path}"
bind % split-window -hc "#{pane_current_path}"
bind '"' split-window -vc "#{pane_current_path}"

# Color for pane border
set -g pane-border-style fg=colour240,bg=black
# Emphasize active pane
set -g pane-active-border-style fg=colour166,bg=colour242

###############
#  bindings   #
###############

##
# check binds: C-t ?

# reload .tmux.conf C-t r
bind r source-file ~/.tmux.conf \; display-message "reloaded :)"

# vi copy/yank key bind
set-window-option -g mode-keys vi
# copy mode by Prefix+v
bind-key v copy-mode \; display "Copy Mode"
# yank to macOS clipboard in copy-mode
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
# paste by Prefix+p
bind-key p paste-buffer

# move between panes like vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize a pane like vim
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

###############
# status line #
###############

# fix status bar on top
set-option -g status-position top
set-option -g status-left-length 20
set-option -g status-right-length 60
# update status line every 1 sec
set-option -g status-interval 1
# make window-status centered
set-option -g status-justify "centre"
set-option -g status-style bg="colour238",fg="colour255"
# format of status-left
set-option -g status-left "#[fg=colour255,bg=colour241]Session: #S #[default]"
# format of status-right: hostname | load average | date/time
set-option -g status-right "#[fg=colour255,bg=colour241]#h | LA: #(uptime | awk -F'load averages: ' '{print $2}') | %m/%d %H:%M:%S#[default]"
# format of window-status
set-window-option -g window-status-format " #I: #W "
# format of window-status on current window
set-window-option -g window-status-current-format "#[fg=colour255,bg=colour130] #I: #W #[default]"
